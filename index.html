<style>
  :root{
    --bg-base:#F4EEE3; --bg-frame:#FFFCF6; --surface:#FBF5EC; --surface2:#F1E9DB; --border:#E6DCCB;
    --text:#2B2620; --muted:#7C7060; --faint:#A39684;
    --gold:#D99A00; --chef-brown:#B06A22; --accent:#F2722B; --accent-soft:rgba(242,114,43,.12);
    --t-spicy:#D6002F;
    --warn:#C98A1E; --danger:#D6483C; --track:#ECE3D4; --shadow:rgba(90,70,35,.18);
    --display:'Fraunces',serif; --body:'Noto Sans KR',sans-serif; --mono:'Space Mono',monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;background:var(--bg-base);font-family:var(--body);color:var(--text)}
  body{min-height:100dvh;overflow-x:hidden}
  @keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .frame{
    width:100%;background:var(--bg-frame);min-height:100dvh;overflow:hidden;
    padding-bottom:env(safe-area-inset-bottom);animation:pop .22s ease;
  }
  @media (min-width:480px){
    body{display:flex;justify-content:center;align-items:flex-start;padding:20px 12px}
    .frame{max-width:400px;min-height:0;border-radius:28px;border:1px solid var(--border);
      box-shadow:0 24px 60px -24px var(--shadow);position:relative}
  }

  /* 공용 헤더 */
  .hd{padding:calc(env(safe-area-inset-top) + 18px) 20px 14px;border-bottom:1px solid var(--border);position:relative}
  .hd .kicker{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--faint);text-transform:uppercase}
  .hd .row{display:flex;align-items:center;gap:11px;margin-top:9px}
  .avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#C77B3C,#7A4A22);
    display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;color:#FFF3E4}
  .hd .name{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.1}
  .hd .sub{font-size:11px;color:var(--muted)}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font-size:12.5px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:9px 13px;cursor:pointer;transition:.15s;min-height:38px;display:inline-flex;align-items:center}
  .chip:active{transform:scale(.95)}
  .chip.on{color:#1a130c;background:var(--accent);border-color:var(--accent)}

  .empty{text-align:center;color:var(--faint);font-size:13px;padding:50px 20px;line-height:1.7}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:var(--track);border-radius:99px;cursor:pointer;touch-action:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--text);box-shadow:0 1px 5px rgba(90,70,35,.3)}
  input[type=range]::-moz-range-thumb{width:26px;height:26px;border:none;border-radius:50%;background:var(--text);box-shadow:0 1px 5px rgba(90,70,35,.3)}

  /* ── 사먹기 ── */
  .buybar{padding:2px 16px 10px}
  .buybar .lab{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;color:var(--faint);text-transform:uppercase;margin:10px 0 8px}
  .buybar .lab:first-child{margin-top:2px}
  .buyspicy{display:flex;align-items:center;gap:10px;margin-top:4px}
  .buyspicy input[type=range]{flex:1}
  .buyspicy .bsval{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--t-spicy);min-width:26px;text-align:right}
  .buyroll{width:100%;margin-top:14px;font-weight:800;font-size:14px;color:#1a130c;background:var(--accent);
    border:none;border-radius:13px;padding:13px;cursor:pointer}
  .buyroll:active{transform:scale(.98)}
  .buypick{margin:12px 16px;padding:16px;border-radius:16px;background:linear-gradient(135deg,var(--accent-soft),var(--surface));
    border:1.5px solid var(--accent);text-align:center}
  .buypick .bpem{font-size:38px;line-height:1}
  .buypick .bpn{font-size:17px;font-weight:800;color:var(--text);margin-top:4px}
  .buypick .bpmeta{font-size:12px;color:var(--muted);margin-top:3px}
  .buylist{padding:4px 16px 16px}
  .buycard{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:12px 13px;margin-bottom:9px}
  .buycard .bch{display:flex;align-items:flex-start;gap:10px}
  .buycard .bcem{font-size:24px;line-height:1.2}
  .buycard .bcn{flex:1;font-weight:700;font-size:14px;color:var(--text)}
  .buycard .bcbrand{font-weight:500;font-size:11.5px;color:var(--faint);margin-top:1px}
  .buycard .bcnote{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.4}
  .buycard .bcfav{background:none;border:none;font-size:16px;cursor:pointer;padding:2px}
  .buycard .bctags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .buycard .bctags span{font-size:10.5px;font-weight:700;padding:2.5px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
  .buycard .spicy0{color:#3F8F4F}.buycard .spicy1{color:var(--warn)}.buycard .spicy2{color:var(--danger)}
  .buycard .bcgo{display:flex;gap:8px;margin-top:10px}
  .buycard .bcgo a{flex:1;text-align:center;text-decoration:none;font-size:12px;font-weight:700;color:var(--text);
    background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 6px}
  .buycard .bcgo a:active{transform:scale(.97)}
</style>
</head>

<div class="frame" id="frame">
  <section id="view-buy">

      <div class="row">
        <div class="avatar" style="background:linear-gradient(135deg,#F2722B,#B06A22)">🛍️</div>

      </div>
    </div>
    <div class="buybar">

      <div class="lab">우리 아이 매운 정도</div>
      <div class="buyspicy"><input type="range" id="buySpicy" min="0" max="10" step="1" value="5" /><span class="bsval" id="buySpicyVal">5</span></div>
      <button class="buyroll" id="buyRoll">🎲 오늘 뭐 사먹지?</button>
    </div>
    <div id="buyPick"></div>
    <div class="buylist" id="buyList"></div>
  </section>
</div>

  {emoji:"🍲",name:"죠스떡볶이 순한맛",brand:"죠스떡볶이 · 배달",src:"delivery",cat:"bunsik",spicy:2,age:"5세+",price:"~1만원대",note:"매운맛 단계 선택 가능, 순한맛으로 주문"},
  {emoji:"🌹",name:"신전떡볶이 로제",brand:"신전떡볶이 · 배달",src:"delivery",cat:"bunsik",spicy:2,age:"5세+",price:"~1만원대",note:"크림이 들어가 덜 자극적이에요"},
  {emoji:"🍜",name:"잔치국수(동네 분식집)",brand:"분식집 · 배달",src:"delivery",cat:"bunsik",spicy:0,age:"3세+",price:"~7천원대",note:"국물 슴슴, 후루룩 먹기 좋아요"},
  {emoji:"🥡",name:"짜장면(중국집)",brand:"중국집 · 배달",src:"delivery",cat:"rice",spicy:0,age:"4세+",price:"~1만원대",note:"단짠 춘장 소스, 아이들 단골 메뉴"},
  {emoji:"🍥",name:"우동(중국집·분식집)",brand:"분식집 · 배달",src:"delivery",cat:"rice",spicy:0,age:"3세+",price:"~1만원대",note:"국물 맑고 부드러운 면"},
  {emoji:"🍣",name:"어린이 초밥세트",brand:"초밥집 · 배달",src:"delivery",cat:"rice",spicy:0,age:"5세+",price:"~2만원대",note:"날생선 대신 계란·게맛살 위주로 주문하기"},
  {emoji:"🍦",name:"배스킨라빈스 킷즈컵",brand:"배스킨라빈스 · 배달",src:"delivery",cat:"snack",spicy:0,age:"3세+",price:"~1만원대",note:"작은 사이즈라 양 조절하기 좋아요"},
  {emoji:"🥯",name:"소보로빵",brand:"베이커리 · 배달",src:"delivery",cat:"snack",spicy:0,age:"2세+",price:"~3천원대",note:"달콤한 기본 간식빵"}
];
function buySpicyLevel(s){ return s<=2?"spicy0":s<=5?"spicy1":"spicy2"; }
const BUY_FAV_KEY="et_buyfav";
function loadBuyFav(){ try{ return JSON.parse(localStorage.getItem(BUY_FAV_KEY)||"[]"); }catch(e){ return []; } }
function saveBuyFav(a){ try{ localStorage.setItem(BUY_FAV_KEY, JSON.stringify(a)); }catch(e){} }
function isBuyFav(name){ return loadBuyFav().includes(name); }
function toggleBuyFav(name){ let a=loadBuyFav(); a=a.includes(name)?a.filter(x=>x!==name):[name,...a]; saveBuyFav(a); buildBuy(); }
let buySrcFilter="all", buyCatFilter="all";
function buyFiltered(){
  const cap=parseInt($("buySpicy").value)||0;
  return BUY_ITEMS.filter(it=>
    (buySrcFilter==="all"||it.src===buySrcFilter) &&
    (buyCatFilter==="all"||it.cat===buyCatFilter) &&
    it.spicy<=cap
  );
}
function buySearchLinks(it){
  const q=encodeURIComponent(it.name);
  if(it.src==="coupang") return [["🛒 쿠팡에서 찾기","https://www.coupang.com/np/search?q="+q]];
  if(it.src==="emart") return [["🏬 이마트몰에서 찾기","https://emart.ssg.com/search.ssg?target=all&query="+q]];
  return [["🛵 배달앱에서 찾기","https://www.google.com/search?q="+encodeURIComponent(it.brand+" "+it.name+" 배달")]];
}
function buyCardHTML(it){
  const lv=buySpicyLevel(it.spicy);
  const spicyTxt=it.spicy===0?"안 매워요":"맵기 "+it.spicy+"/10";
  const links=buySearchLinks(it);
  return `<div class="buycard" data-name="${it.name}">
    <div class="bch"><span class="bcem">${it.emoji}</span>
      <div style="flex:1"><div class="bcn">${it.name}</div><div class="bcbrand">${it.brand}</div></div>
      <button class="bcfav" data-name="${it.name}" aria-label="찜">${isBuyFav(it.name)?"❤️":"🤍"}</button>
    </div>
    <div class="bcnote">${it.note}</div>
    <div class="bctags"><span class="${lv}">${spicyTxt}</span><span>${it.age}</span><span>${it.price}</span></div>
    <div class="bcgo">${links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join("")}</div>
  </div>`;
}
function buildBuy(){
  const scEl=$("buySrcChips"), ccEl=$("buyCatChips");
  if(scEl&&!scEl.childElementCount) scEl.innerHTML=BUY_SRC.map(([k,l])=>`<button class="chip${k===buySrcFilter?" on":""}" data-src="${k}">${l}</button>`).join("");
  if(ccEl&&!ccEl.childElementCount) ccEl.innerHTML=BUY_CAT.map(([k,l])=>`<button class="chip${k===buyCatFilter?" on":""}" data-cat="${k}">${l}</button>`).join("");
  const list=buyFiltered().sort((a,b)=>(isBuyFav(b.name)?1:0)-(isBuyFav(a.name)?1:0));
  const el=$("buyList");
  el.innerHTML=list.length?list.map(buyCardHTML).join(""):`<div class="empty" style="padding:30px 20px">이 조건에 맞는 메뉴가 없어요.<br>맵기 상한을 올리거나 필터를 바꿔보세요.</div>`;
  el.querySelectorAll(".bcfav").forEach(b=>b.onclick=e=>{ e.stopPropagation(); toggleBuyFav(b.dataset.name); });
}
function buyRoll(){
  const list=buyFiltered();
  const pk=$("buyPick");
  if(!list.length){ pk.innerHTML=""; alert("이 조건에 맞는 메뉴가 없어요 😅\n맵기 상한을 올리거나 필터를 바꿔보세요."); return; }
  const it=list[Math.floor(Math.random()*list.length)];
  pk.innerHTML=`<div class="buypick"><div class="bpem">${it.emoji}</div><div class="bpn">${it.name}</div>
    <div class="bpmeta">${it.brand} · ${it.spicy===0?"안 매워요":"맵기 "+it.spicy+"/10"} · ${it.age}</div></div>`;
}
$("buySrcChips").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b) return; buySrcFilter=b.dataset.src;
  $("buySrcChips").querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b)); buildBuy(); });
$("buyCatChips").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b) return; buyCatFilter=b.dataset.cat;
  $("buyCatChips").querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b)); buildBuy(); });
$("buySpicy").addEventListener("input", e=>{ $("buySpicyVal").textContent=e.target.value; buildBuy(); });
$("buyRoll").addEventListener("click", buyRoll);
buildBuy();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}</script>
